# Central configuration for the tomobench project.
# Units are expressed explicitly where practical to reduce hidden assumptions.

project:
  title: Tomographic Modeling of Subsurface Structures Using Machine Learning with Synthetic Seismic Data
  repository_status: first_vertical_slice

study_area:
  coordinate_system: cartesian_km
  x_range_km: [0.0, 100.0]
  y_range_km: [0.0, 100.0]
  z_range_km: [0.0, 30.0]
  surface_elevation_km: 0.0
  margin_km: 5.0

station_generation:
  default_mode: random
  supported_modes: [random, grid]
  station_count: 49
  random_configuration_count: 10
  grid_rows: 7
  grid_cols: 7
  station_elevation_km: 0.0

earthquake_generation:
  default_mode: random
  supported_modes: [random, clustered, fault_based]
  event_count: 1000
  depth_range_km: [1.0, 29.0]
  clustered:
    cluster_count: 2
    cluster_spread_km: 8.0
  fault_based:
    strike_deg: 45.0
    dip_deg: 70.0
    length_km: 40.0
    width_km: 15.0

velocity_model_generation:
  default_scenario: layered
  supported_scenarios: [layered, block_anomaly, faulted, salt_dome, dyke_intrusion]
  grid_spacing_km: 1.0
  velocity_bounds_km_per_s: [3.0, 8.0]
  layered:
    layer_count: 5
    depth_boundaries_km: [0.0, 5.0, 12.0, 18.0, 24.0, 30.0]
    velocities_km_per_s: [4.0, 5.0, 6.0, 6.8, 7.4]
  block_anomaly:
    center_km: [50.0, 50.0, 16.0]
    size_km: [10.0, 10.0, 8.0]
    velocity_delta_km_per_s: 0.6
  faulted:
    fault_x_km: 50.0
    fault_y_km: 50.0
    strike_deg: 90.0
    dip_deg: 70.0
    dip_direction: positive_normal
    positive_side: greater_equal
    velocity_offset_km_per_s: 0.4
  salt_dome:
    center_km: [50.0, 50.0, 7.0]
    radii_km: [8.0, 8.0, 5.0]
    body_velocity_km_per_s: 5.6
  dyke_intrusion:
    center_km: [50.0, 50.0, 15.0]
    strike_deg: 0.0
    length_km: 32.0
    width_km: 3.0
    top_depth_km: 4.0
    bottom_depth_km: 26.0
    body_velocity_km_per_s: 6.8

simulation:
  phase: P
  method: pseudo_bending_3d
  supported_methods:
    - straight_line_layered_placeholder
    - layered_ray_tracing
    - eikonal_3d_first_arrival_prototype
    - pseudo_bending_3d
  allow_curved_rays: true
  first_arrival_only: true
  numerical_tolerance: 1.0e-6
  assumptions:
    - Targets first-arrival P-wave travel times only for synthetic velocity models.
    - Pseudo-bending 3D is the default paper-facing simulator for current synthetic observation generation.
    - Existing 1D layered methods remain available for controlled baseline comparisons.
    - The eikonal prototype remains available only as a graph-based Cartesian-grid benchmark/comparison approximation, not as the default data-generation method.
    - The pseudo-bending 3D method uses Snell-law bending across horizontal layers and explicit geological-interface crossings without smoothed trilinear velocity interpolation.
    - Reflections, converted phases, scattering, attenuation, finite-frequency effects, full waveform modeling, amplitude modeling, complex source mechanisms, GPU acceleration, and real-data validation are outside the current scope.

eikonal_solver:
  grid_spacing_km: 5.0
  x_grid_spacing_km: 5.0
  y_grid_spacing_km: 5.0
  z_grid_spacing_km: 2.5
  connectivity: 26
  interpolation: nearest
  max_grid_nodes: 100000
  benchmark_connectivities: [6, 18, 26]
  benchmark_grid_spacings_km: [10.0, 5.0, 2.5]
  runtime_repeat_count: 1

pseudo_bending_solver:
  initial_ray_point_count: 5
  max_ray_point_count: 65
  max_iterations_per_level: 30
  convergence_tolerance_s: 1.0e-5
  perturbation_step_km: 0.25
  min_perturbation_step_km: 0.001
  max_point_move_km: 2.5
  finite_difference_step_km: 0.1
  velocity_interpolation: piecewise_constant_interfaces
  boundary_handling: clamp_to_model_domain

dataset_export:
  base_dir: outputs/datasets
  schema_version: 0.1.0
  export_formats: [csv, parquet]
  include_metadata_columns: true

machine_learning:
  target_representation: velocity_grid
  target_grid:
    representation: fixed_shape_cartesian_velocity_grid_3d
    value_field: p_velocity_km_per_s
    value_semantics: absolute_velocity
    value_location: node_centered
    flattening_order: x_fastest_index_ix_plus_nx_times_iy_plus_ny_times_iz
    scenario_batch: [layered, block_anomaly, faulted]
  first_target_batch:
    batch_id: first_ml_target_batch_v1
    scenarios: [layered, block_anomaly, faulted]
    manifest_path: outputs/datasets/ml_targets/first_ml_target_batch_v1/manifest.json
  first_supervised_pairing:
    pairing_id: first_ml_supervised_pairs_v1
    scenarios: [layered, block_anomaly, faulted]
    simulation_method: pseudo_bending_3d
    manifest_path: outputs/datasets/ml_supervised/first_ml_supervised_pairs_v1/manifest.json
  expanded_pairing:
    batch_id: first_ml_expanded_pairs_v1
    simulation_method: pseudo_bending_3d
    manifest_path: outputs/datasets/ml_supervised/first_ml_expanded_pairs_v1/manifest.json
    cases:
      - case_id: layered_reference
        scenario: layered
      - case_id: block_anomaly_reference
        scenario: block_anomaly
      - case_id: block_anomaly_shallow
        scenario: block_anomaly
        block_anomaly_center_km: [50.0, 50.0, 10.0]
        block_anomaly_size_km: [10.0, 10.0, 6.0]
        block_anomaly_velocity_delta_km_per_s: 0.5
      - case_id: block_anomaly_offset
        scenario: block_anomaly
        block_anomaly_center_km: [60.0, 40.0, 20.0]
        block_anomaly_size_km: [12.0, 8.0, 8.0]
        block_anomaly_velocity_delta_km_per_s: 0.4
      - case_id: faulted_reference
        scenario: faulted
      - case_id: faulted_west_shift
        scenario: faulted
        fault_x_km: 40.0
        fault_y_km: 50.0
        fault_strike_deg: 90.0
        fault_dip_deg: 70.0
        fault_dip_direction: positive_normal
        fault_positive_side: greater_equal
        fault_velocity_offset_km_per_s: 0.4
      - case_id: faulted_east_shift
        scenario: faulted
        fault_x_km: 60.0
        fault_y_km: 50.0
        fault_strike_deg: 90.0
        fault_dip_deg: 70.0
        fault_dip_direction: positive_normal
        fault_positive_side: less_equal
        fault_velocity_offset_km_per_s: 0.35
      - case_id: salt_dome_reference
        scenario: salt_dome
      - case_id: salt_dome_shallow
        scenario: salt_dome
        salt_dome_center_km: [50.0, 50.0, 7.0]
        salt_dome_radii_km: [8.0, 8.0, 5.0]
        salt_dome_body_velocity_km_per_s: 5.6
      - case_id: salt_dome_offset
        scenario: salt_dome
        salt_dome_center_km: [62.0, 42.0, 8.0]
        salt_dome_radii_km: [7.0, 8.0, 5.0]
        salt_dome_body_velocity_km_per_s: 5.5
      - case_id: dyke_intrusion_reference
        scenario: dyke_intrusion
      - case_id: dyke_intrusion_narrow
        scenario: dyke_intrusion
        dyke_intrusion_center_km: [50.0, 50.0, 15.0]
        dyke_intrusion_strike_deg: 0.0
        dyke_intrusion_length_km: 30.0
        dyke_intrusion_width_km: 3.0
        dyke_intrusion_top_depth_km: 5.0
        dyke_intrusion_bottom_depth_km: 24.0
        dyke_intrusion_body_velocity_km_per_s: 6.8
      - case_id: dyke_intrusion_offset
        scenario: dyke_intrusion
        dyke_intrusion_center_km: [38.0, 58.0, 15.0]
        dyke_intrusion_strike_deg: 25.0
        dyke_intrusion_length_km: 28.0
        dyke_intrusion_width_km: 4.0
        dyke_intrusion_top_depth_km: 6.0
        dyke_intrusion_bottom_depth_km: 25.0
        dyke_intrusion_body_velocity_km_per_s: 6.7
  observation_pairing:
    batch_id: observation_full_grid_pairs_v1
    simulation_method: pseudo_bending_3d
