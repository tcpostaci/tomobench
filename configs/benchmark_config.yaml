        earthquake_seed: 2105
    families:
      - scenario: layered
        geometry_profile_ids: [random_a, random_b, grid_a, random_c, grid_b]
        parameter_variants:
          - variant_id: reference
          - variant_id: shallow_fast
            layered_velocities_km_per_s: [4.2, 5.2, 6.0, 6.8, 7.4]
          - variant_id: mid_slow
            layered_velocities_km_per_s: [4.0, 4.8, 5.7, 6.6, 7.3]
          - variant_id: deep_fast
            layered_velocities_km_per_s: [4.0, 5.0, 6.1, 7.0, 7.6]
      - scenario: block_anomaly
