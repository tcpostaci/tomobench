[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tomobench"
version = "0.1.0"
description = "Research code scaffold for synthetic seismic tomography workflows."
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "PyYAML>=6.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.11.0",
]

[project.scripts]
tomobench = "tomobench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tomobench"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["pytest-cache-files-*"]
